packages:
  - 'apps/*'

# Approve the post-install build scripts both apps need (pnpm blocks them by
# default). Merged from the two former per-app workspace files.
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
